name: rustshot
title: Rustshot
base: core24
adopt-info: rustshot
summary: Screenshots, editing and video capture
description: |
  Tiny yet powerful, beautiful, open-source and cross-platform tool for screenshots, editing and video capture.
  Rustshot captures a region, a window or the whole screen, lets you annotate it (arrows, shapes, text, callouts, blur, numbered tags and more), and copies, saves, pins or uploads it. It also records the screen to MP4 or GIF with sound, microphone and a camera bubble, keeps a history of captures you can re-edit, and recognises text (OCR). One small native binary, no runtime.
grade: stable
confinement: strict
license: GPL-3.0-only
icon: packaging/icons/rustshot-256.png
platforms:
  amd64:

apps:
  rustshot:
    command: bin/rustshot
    common-id: io.github.nappsllc.rustshot
    desktop: usr/share/applications/io.github.nappsllc.rustshot.desktop
    # desktop: the xdg-desktop-portal interfaces (ScreenCast for recording on
    # Wayland, Screenshot, the camera portal); camera: the camera bubble
    # (V4L2); audio-record + pulseaudio: system sound and the microphone
    # while recording. No screencast-legacy: it is a privileged interface
    # and the portals need none (docs/STORES.md). unity7: the tray icon
    # (StatusNotifierItem): owning org.kde.StatusNotifierItem-<pid>-1,
    # registering with org.kde.StatusNotifierWatcher and serving
    # /StatusNotifierItem and the /MenuBar dbusmenu; desktop alone does
    # not allow those.
    plugs: [x11, network, home, desktop, unity7, camera, audio-record, pulseaudio]
    environment:
      # The staged libraries (dlopen'ed: libpulse-simple, libopus,
      # libpipewire and its modules) rather than the base snap's.
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio
      PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/x86_64-linux-gnu/pipewire-0.3
      SPA_PLUGIN_DIR: $SNAP/usr/lib/x86_64-linux-gnu/spa-0.2

parts:
  rustshot:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages: [libx11-dev, libxrandr-dev, libxext-dev, libxfixes-dev]
    stage-packages:
      - libx11-6
      - libxrandr2
      - libxext6
      - libxfixes3
      # Recording: sound (libpulse-simple), Opus for MP4s made with
      # OpenH264, PipeWire for the ScreenCast/Camera portals' streams, and
      # bzip2 + curl for the user-requested OpenH264 download (no ffmpeg in
      # a snap).
      - libpulse0
      - libopus0
      - libpipewire-0.3-0t64
      - libpipewire-0.3-modules
      - libspa-0.2-modules
      - bzip2
      - curl
    parse-info: [usr/share/metainfo/io.github.nappsllc.rustshot.metainfo.xml]
    override-build: |
      craftctl default
      craftctl set version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$CRAFT_PART_SRC/Cargo.toml" | head -n1)"
      install -Dm644 packaging/linux/io.github.nappsllc.rustshot.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.nappsllc.rustshot.desktop"
      install -Dm644 packaging/linux/io.github.nappsllc.rustshot.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.nappsllc.rustshot.metainfo.xml"
      install -Dm644 packaging/icons/rustshot-256.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/io.github.nappsllc.rustshot.png"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/rustshot/LICENSE"
      install -Dm644 THIRD_PARTY_NOTICES.md "$CRAFT_PART_INSTALL/usr/share/doc/rustshot/THIRD_PARTY_NOTICES.md"
