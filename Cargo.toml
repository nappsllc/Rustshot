[package]
name = "rustshot"
version = "0.4.0"
edition = "2024"
# Derivative of Flameshot (GPL-3.0): behavior and UI modeled on it.
license = "GPL-3.0-only"
description = "Tiny yet powerful, beautiful, open-source and cross-platform tool for screenshots, editing and video capture"

[dependencies]
anyhow = "1"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }

# The UI font is baked at build time (build.rs); annotation text uses the OS
# text renderer (GDI, CoreText) except on Linux, which rasterises a system
# font with ab_glyph.
[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2"

[build-dependencies]
ab_glyph = "0.2"

# Tests compare the baked font against ab_glyph's own layout and coverage,
# and the hand-rolled PNG codec (src/pngfile.rs) against the png crate.
[dev-dependencies]
ab_glyph = "0.2"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Security",
    # The S3 secret access key in Credential Manager (CredWriteW / CredReadW).
    "Win32_Security_Credentials",
    # S3 object keys: 128 random bits from BCryptGenRandom.
    "Win32_Security_Cryptography",
    "Win32_Networking_WinHttp",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    # Uniscribe (ScriptStringCPtoX): the text caret in right-to-left text.
    "Win32_Globalization",
    # Window snapping: cloaked windows, the drawn frame (no invisible borders).
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    # Screen recording: Desktop Duplication, Media Foundation, WASAPI.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # HDR screenshots: each display's SDR white level (DisplayConfig).
    "Win32_Devices_Display",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_UI_Shell_PropertiesSystem",
    # Copy text (OCR): RoInitialize, RoGetActivationFactory (Windows.Media.Ocr).
    "Win32_System_WinRT",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
